# TESTING.md §11 (DEC-035). PRs run the signed-out e2e (smoke + axe) on a local build; after a
# deploy, `journeys` runs the signed-in ones on production. Not here: visual diffs (manual pass).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # install @mohitbhalotia/magica-contracts from GitHub Packages
    env:
      # Clerk decodes the publishable key while prerendering, so build and e2e need the real dev keys.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Writes a user-level .npmrc reading NODE_AUTH_TOKEN (pnpm ignores tokens in the repo .npmrc).
          registry-url: https://npm.pkg.github.com
          scope: "@mohitbhalotia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm audit --prod --audit-level high

  # Built in Actions (not by Vercel's git integration) so the contracts install can use GITHUB_TOKEN.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@mohitbhalotia"
      - name: Deploy app to Vercel (env vars come from the Vercel project)
        run: |
          pnpm dlx vercel@64.5.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          pnpm dlx vercel@64.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
          pnpm dlx vercel@64.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # M6 step 6: the signed-in journeys (free model only, no Magica credits) against what was just
  # deployed, as the seeded Clerk e2e user. Media journeys spend credits and are run by hand.
  journeys:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      E2E_BASE_URL: https://magica-galaxy-frontend.vercel.app
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@mohitbhalotia"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:journeys
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: journeys-report
          path: test-results
          if-no-files-found: ignore
